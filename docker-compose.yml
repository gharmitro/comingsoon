# GharMitro — local API + admin
#
# Expects Postgres already running on the host (e.g. container postgres-db on :5432).
# Create the DB once if needed:
#   docker exec -it postgres-db psql -U postgres -c 'CREATE DATABASE service_booking;'
#
# Usage:
#   docker compose up --build
#
# Override DB / Firebase credentials via a root .env file or environment variables.
# Firebase is off by default (stub auth). Set FIREBASE_ENABLED=true + credentials for real tokens.

services:
  backend:
    build:
      context: ./backend
    image: gharmitro-backend:local
    container_name: gharmitro-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      SERVER_PORT: 8080
      DB_URL: ${DB_URL:-jdbc:postgresql://host.docker.internal:5432/service_booking}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      FIREBASE_ENABLED: ${FIREBASE_ENABLED:-false}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_CREDENTIALS_PATH: ${FIREBASE_CREDENTIALS_PATH:-}
      FIREBASE_CREDENTIALS_JSON: ${FIREBASE_CREDENTIALS_JSON:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  admin:
    build:
      context: ./admin
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080/api/v1}
    image: gharmitro-admin:local
    container_name: gharmitro-admin
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    depends_on:
      - backend
    restart: unless-stopped
